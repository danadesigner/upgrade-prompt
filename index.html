const PHONE_MAX = 480;
const TABLET_MAX = 900;
const MIN_W = 320;
const MAX_W = 1240;
function getBP(w) { return w < PHONE_MAX ? 'phone' : w < TABLET_MAX ? 'tablet' : 'desktop'; }

// ─── Shared ───────────────────────────────────────────────────────────────────
function useCountdown(initialSeconds = 57 * 60 + 30) {
  const [s, setS] = React.useState(initialSeconds);
  React.useEffect(() => {
    if (s <= 0) return;
    const id = setInterval(() => setS(v => Math.max(0, v - 1)), 1000);
    return () => clearInterval(id);
  }, [s]);
  return { hh: String(Math.floor(s / 3600)).padStart(2,'0'), mm: String(Math.floor((s%3600)/60)).padStart(2,'0'), ss: String(s%60).padStart(2,'0'), raw: s };
}

function PressableButton({ children, onClick, style={}, hoverStyle={}, ariaLabel, type='button', disabled=false }) {
  const [hover, setHover] = React.useState(false);
  const [press, setPress] = React.useState(false);
  return (
    <button type={type} aria-label={ariaLabel} disabled={disabled} onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => { setHover(false); setPress(false); }}
      onMouseDown={() => setPress(true)} onMouseUp={() => setPress(false)}
      style={{ border:0, cursor:disabled?'default':'pointer', fontFamily:'inherit', fontWeight:'inherit', color:'inherit', background:'transparent', padding:0, transform:press?'scale(0.98)':'scale(1)', transition:'transform 120ms ease, background 180ms ease, box-shadow 180ms ease, color 180ms ease, border-color 180ms ease', ...style, ...(hover&&!disabled?hoverStyle:{}) }}>
      {children}
    </button>
  );
}

function Collapsible({ open, children }) {
  const ref = React.useRef(null);
  const [h, setH] = React.useState('auto');
  React.useEffect(() => {
    if (!ref.current) return;
    if (open) { setH(ref.current.scrollHeight); const id = setTimeout(() => setH('auto'), 350); return () => clearTimeout(id); }
    else { setH(ref.current.scrollHeight); requestAnimationFrame(() => setH(0)); }
  }, [open]);
  return (
    <div style={{ height:h, opacity:open?1:0, overflow:'hidden', transition:'height 320ms cubic-bezier(.4,.0,.2,1), opacity 240ms ease' }}>
      <div ref={ref}>{children}</div>
    </div>
  );
}

            <Icon.clock size={12}/> LIMITED OFFER
          </div>
        </div>

      <div aria-hidden="true" style={{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:130,height:5,borderRadius:3,background:'rgba(255,255,255,0.28)',zIndex:100}}/>
    </div>
  );
}

function TabletFrame({ children, width, height }) {
  return (
    <div style={{width,height,borderRadius:28,background:'linear-gradient(160deg,#1E1E26,#17171E)',border:'1.5px solid rgba(255,255,255,0.10)',boxShadow:'0 0 0 1px rgba(0,0,0,0.55),0 48px 100px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.12)',overflow:'hidden',position:'relative',flexShrink:0}}>
      {/* Camera */}
      <div aria-hidden="true" style={{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',width:8,height:8,borderRadius:999,background:'#2C2C36',zIndex:10}}/>
      {/* Side button */}
      <div aria-hidden="true" style={{position:'absolute',right:-2,top:160,width:3,height:60,borderRadius:'0 2px 2px 0',background:'rgba(255,255,255,0.08)'}}/>
      <div style={{position:'absolute',inset:0,borderRadius:26,overflow:'hidden'}}>{children}</div>
      {/* Home bar */}
      <div aria-hidden="true" style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:120,height:4,borderRadius:3,background:'rgba(255,255,255,0.2)',zIndex:100}}/>
    </div>
  );
}

function BrowserFrame({ children, width, height, url }) {
  return (
    <div style={{width,height,borderRadius:14,border:'1px solid rgba(255,255,255,0.10)',boxShadow:'0 0 0 1px rgba(0,0,0,0.5),0 48px 120px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.08)',overflow:'hidden',display:'flex',flexDirection:'column',flexShrink:0}}>
      <div style={{height:44,background:'#1C1C22',borderBottom:'1px solid rgba(255,255,255,0.07)',display:'flex',alignItems:'center',padding:'0 16px',flexShrink:0}}>
        <div style={{display:'flex',gap:8,marginRight:16}}>
          {['#FF5F57','#FFBD2E','#28CA41'].map(c=><div key={c} style={{width:12,height:12,borderRadius:999,background:c}}/>)}
        </div>
        <div style={{flex:1,display:'flex',justifyContent:'center'}}>
          <div style={{height:27,minWidth:200,maxWidth:360,width:'36%',borderRadius:7,background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.07)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'rgba(255,255,255,0.38)',fontFamily:'"Inter",system-ui,sans-serif',gap:5}}>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" aria-hidden="true"><rect x="1" y="3" width="10" height="8" rx="1.5"/><path d="M4 3V2.5a2 2 0 1 1 4 0V3"/></svg>
            {url}
          </div>
        </div>
      </div>
      <div style={{flex:1,overflow:'hidden',position:'relative'}}>{children}</div>
    </div>
  );
}

// ─── Brand Switch ─────────────────────────────────────────────────────────────
function BrandSwitch({ brand, onChange }) {
  const opts = [
    { id:'snabbnet', label:'Snabbnet', font:SN.display, weight:800, color:SN.orange, ink:SN.orangeInk },
    { id:'aurelia',  label:'Aurelia',  font:AU.display, weight:500, color:AU.indigo, ink:'#fff' },
  ];
  return (
    <div role="group" aria-label="Brand selector" style={{display:'flex',background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:999,padding:4,gap:2}}>
      {opts.map(b => {
        const active = brand === b.id;
        return (
          <button key={b.id} onClick={() => onChange(b.id)} aria-pressed={active}
            style={{'--focus-ring':b.color,padding:'10px 32px',borderRadius:999,background:active?b.color:'transparent',color:active?b.ink:'rgba(255,255,255,0.38)',fontFamily:b.font,fontWeight:active?b.weight:500,fontSize:15,letterSpacing:b.id==='snabbnet'?'-0.01em':'0.02em',transition:'all 0.22s cubic-bezier(.4,0,.2,1)',boxShadow:active?`0 2px 18px ${b.color}55`:'none',border:'none',cursor:'pointer'}}>
            {b.label}
          </button>
        );
      })}
    </div>
  );
}

// ─── Breakpoint bar ───────────────────────────────────────────────────────────
function BreakpointBar({ width, bp }) {
  const total = MAX_W - MIN_W;
  const pct = ((width - MIN_W) / total) * 100;
  const zones = [
    { id:'phone',   from:0,                              to:(PHONE_MAX-MIN_W)/total*100,  color:SN.orange,  label:'Phone'   },
    { id:'tablet',  from:(PHONE_MAX-MIN_W)/total*100,   to:(TABLET_MAX-MIN_W)/total*100, color:'#A78BFA',  label:'Tablet'  },
    { id:'desktop', from:(TABLET_MAX-MIN_W)/total*100,  to:100,                          color:AU.indigo,  label:'Desktop' },
  ];
  const activeColor = zones.find(z=>z.id===bp).color;
  return (
    <div style={{display:'flex',flexDirection:'column',gap:6,width:'100%',maxWidth:560}}>
      {/* Zone labels */}
      <div style={{display:'flex',position:'relative',height:16}}>
        {zones.map(z=>(
          <div key={z.id} style={{position:'absolute',left:`${z.from}%`,width:`${z.to-z.from}%`,display:'flex',justifyContent:'center'}}>
            <span style={{fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:bp===z.id?z.color:'rgba(255,255,255,0.2)',transition:'color 0.2s',whiteSpace:'nowrap'}}>{z.label}</span>
          </div>
        ))}
      </div>
      {/* Track */}
      <div style={{position:'relative',height:3,borderRadius:2,background:'rgba(255,255,255,0.08)'}}>
        {/* Zone segments */}
        {zones.map(z=>(
          <div key={z.id} style={{position:'absolute',left:`${z.from}%`,width:`${z.to-z.from}%`,height:'100%',background:bp===z.id?`${z.color}40`:'transparent',borderRadius:2,transition:'background 0.2s'}}/>
        ))}
        {/* Separator ticks */}
        {[(PHONE_MAX-MIN_W)/total*100,(TABLET_MAX-MIN_W)/total*100].map((p,i)=>(
          <div key={i} style={{position:'absolute',left:`${p}%`,top:-2,width:1,height:7,background:'rgba(255,255,255,0.15)',transform:'translateX(-50%)'}}/>
        ))}
        {/* Thumb */}
        <div style={{position:'absolute',left:`${pct}%`,top:'50%',transform:'translate(-50%,-50%)',width:10,height:10,borderRadius:999,background:activeColor,boxShadow:`0 0 8px ${activeColor}`,transition:'background 0.2s,box-shadow 0.2s'}}/>
      </div>
      {/* Width label under thumb */}
      <div style={{position:'relative',height:14}}>
        <span style={{position:'absolute',left:`${pct}%`,transform:'translateX(-50%)',fontFamily:'"JetBrains Mono",monospace',fontSize:10,color:'rgba(255,255,255,0.35)',whiteSpace:'nowrap',transition:'left 0s'}}>{width}px</span>
      </div>
    </div>
  );
}

// ─── Resizable Preview ────────────────────────────────────────────────────────
function ResizablePreview({ brand }) {
  const [width, setWidth] = React.useState(393);
  const dragging = React.useRef(false);
  const startX = React.useRef(0);
  const startW = React.useRef(0);

  React.useEffect(() => {
    const onMove = e => {
      if (!dragging.current) return;
      const cx = e.clientX;
      setWidth(Math.round(Math.max(MIN_W, Math.min(MAX_W, startW.current + cx - startX.current))));
    };
    const onUp = () => {
      if (!dragging.current) return;
      dragging.current = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, []);

  const onHandleDown = e => {
    dragging.current = true;
    startX.current = e.clientX;
    startW.current = width;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  };

  const bp = getBP(width);
  const frameH =
    bp === 'desktop' ? 640 :
    bp === 'tablet'  ? Math.min(Math.round(width * 1.35), 860) :
                       Math.min(Math.round(width * 2.167), 852);

  const content = bp === 'desktop'
    ? (brand === 'snabbnet' ? <SnabbnetDesktop key={brand}/> : <AureliaDesktop key={brand}/>)
    : (brand === 'snabbnet' ? <SnabbnetHome key={brand}/> : <AureliaHome key={brand}/>);

  const url = brand === 'snabbnet' ? 'my.snabbnet.se' : 'my.aurelia.com';

  // Drag handle hover state
  const [hov, setHov] = React.useState(false);

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:16}}>
      <BreakpointBar width={width} bp={bp}/>
      <div style={{display:'flex',alignItems:'flex-start'}}>
        {bp==='phone'   && <IOSFrame width={width} height={frameH}>{content}</IOSFrame>}
        {bp==='tablet'  && <TabletFrame width={width} height={frameH}>{content}</TabletFrame>}
        {bp==='desktop' && <BrowserFrame width={width} height={frameH} url={url}>{content}</BrowserFrame>}

        {/* Drag handle */}
        <div
          onMouseDown={onHandleDown}
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          title="Drag to resize"
          style={{width:32,height:frameH,display:'flex',alignItems:'center',justifyContent:'center',cursor:'col-resize',flexShrink:0,marginLeft:4,transition:'opacity 0.15s'}}>
          <div style={{width:4,height:48,borderRadius:4,background:hov?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.1)',transition:'background 0.15s',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5}}>
            {[0,1,2].map(i=><div key={i} style={{width:4,height:4,borderRadius:999,background:hov?'rgba(255,255,255,0.8)':'rgba(255,255,255,0.3)',transition:'background 0.15s'}}/>)}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [brand, setBrand] = React.useState('snabbnet');
  return (
    <div style={{minHeight:'100vh',background:'#14141a',padding:'64px 60px 100px',display:'flex',flexDirection:'column',alignItems:'center',gap:40,overflowX:'auto'}}>
      {/* Header */}
      <div style={{textAlign:'center',flexShrink:0}}>
        <p style={{fontFamily:'"Inter",system-ui',fontSize:10,fontWeight:600,color:'rgba(255,255,255,0.28)',letterSpacing:'0.16em',textTransform:'uppercase',marginBottom:10}}>
          Upgrade Prompt · Multibrand Component · WCAG 2.1 AA
        </p>
        <h1 style={{fontFamily:'"Inter Tight",system-ui',fontWeight:700,fontSize:30,color:'#fff',letterSpacing:'-0.025em',display:'flex',alignItems:'center',justifyContent:'center',gap:14,margin:0}}>
          <span style={{color:SN.orange}}>Snabbnet</span>
          <span style={{color:'rgba(255,255,255,0.18)',fontWeight:300,fontSize:26}}>×</span>
          <span style={{color:AU.indigo}}>Aurelia</span>
        </h1>
      </div>

      {/* Brand switch */}
      <BrandSwitch brand={brand} onChange={setBrand}/>

      {/* Resizable preview */}
      <ResizablePreview brand={brand}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
